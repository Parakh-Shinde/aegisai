name: aegisai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegisai}
      POSTGRES_USER: ${POSTGRES_USER:-aegisai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aegisai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - aegisai-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegisai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aegisai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AEGISAI_CORS_ORIGINS: ${AEGISAI_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AEGISAI_TRUSTED_HOSTS: ${AEGISAI_TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      AEGISAI_MAX_REQUEST_BODY_BYTES: ${AEGISAI_MAX_REQUEST_BODY_BYTES:-1048576}
      AEGISAI_MAX_FILE_SCAN_BYTES: ${AEGISAI_MAX_FILE_SCAN_BYTES:-1048576}
      AEGISAI_MAX_RAG_SOURCE_CHARACTERS: ${AEGISAI_MAX_RAG_SOURCE_CHARACTERS:-65536}
      AEGISAI_MAX_AGENT_ACTION_CHARACTERS: ${AEGISAI_MAX_AGENT_ACTION_CHARACTERS:-32768}
      AEGISAI_AGENT_GATEWAY_TOKEN: ${AEGISAI_AGENT_GATEWAY_TOKEN:-}
      AEGISAI_TOOL_RUNNER_TOKEN: ${AEGISAI_TOOL_RUNNER_TOKEN:-}
      AEGISAI_AGENT_ENFORCEMENT_MODE: ${AEGISAI_AGENT_ENFORCEMENT_MODE:-enforce}
      AEGISAI_EXPOSE_API_DOCS: ${AEGISAI_EXPOSE_API_DOCS:-true}
      AEGISAI_API_KEY: ${AEGISAI_API_KEY:-}
      AEGISAI_ALLOW_REMOTE_OLLAMA: ${AEGISAI_ALLOW_REMOTE_OLLAMA:-false}
      AEGISAI_APPROVED_MODEL_ENDPOINTS: ${AEGISAI_APPROVED_MODEL_ENDPOINTS:-}
      AEGISAI_LOCAL_MODEL_ENDPOINTS: ${AEGISAI_LOCAL_MODEL_ENDPOINTS:-}
      AEGISAI_ENVIRONMENT: ${AEGISAI_ENVIRONMENT:-development}
      AEGISAI_AUTH_REQUIRED: ${AEGISAI_AUTH_REQUIRED:-false}
      AEGISAI_JWT_SECRET: ${AEGISAI_JWT_SECRET:?Set AEGISAI_JWT_SECRET in .env}
      AEGISAI_EVIDENCE_ENCRYPTION_KEY: ${AEGISAI_EVIDENCE_ENCRYPTION_KEY:-}
      AEGISAI_MODEL_MAX_OUTPUT_TOKENS: ${AEGISAI_MODEL_MAX_OUTPUT_TOKENS:-512}
      AEGISAI_MODEL_TIMEOUT_SECONDS: ${AEGISAI_MODEL_TIMEOUT_SECONDS:-60}
      AEGISAI_MODEL_MAX_CONCURRENCY: ${AEGISAI_MODEL_MAX_CONCURRENCY:-2}
      AEGISAI_REDIS_URL: ${AEGISAI_REDIS_URL:-redis://redis:6379/0}
      AEGISAI_ASYNC_CAMPAIGNS: ${AEGISAI_ASYNC_CAMPAIGNS:-false}
      AEGISAI_BOOTSTRAP_TOKEN: ${AEGISAI_BOOTSTRAP_TOKEN:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegisai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aegisai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AEGISAI_LOCAL_MODEL_ENDPOINTS: ${AEGISAI_LOCAL_MODEL_ENDPOINTS:-}
      AEGISAI_ALLOW_REMOTE_OLLAMA: ${AEGISAI_ALLOW_REMOTE_OLLAMA:-false}
      AEGISAI_APPROVED_MODEL_ENDPOINTS: ${AEGISAI_APPROVED_MODEL_ENDPOINTS:-}
      AEGISAI_ENVIRONMENT: ${AEGISAI_ENVIRONMENT:-development}
      AEGISAI_AUTH_REQUIRED: ${AEGISAI_AUTH_REQUIRED:-false}
      AEGISAI_CORS_ORIGINS: ${AEGISAI_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AEGISAI_TRUSTED_HOSTS: ${AEGISAI_TRUSTED_HOSTS:-localhost,127.0.0.1}
      AEGISAI_JWT_SECRET: ${AEGISAI_JWT_SECRET:?Set AEGISAI_JWT_SECRET in .env}
      AEGISAI_EVIDENCE_ENCRYPTION_KEY: ${AEGISAI_EVIDENCE_ENCRYPTION_KEY:-}
      AEGISAI_REDIS_URL: ${AEGISAI_REDIS_URL:-redis://redis:6379/0}
      AEGISAI_ASYNC_CAMPAIGNS: ${AEGISAI_ASYNC_CAMPAIGNS:-false}
      AEGISAI_TOOL_RUNNER_TOKEN: ${AEGISAI_TOOL_RUNNER_TOKEN:-}
      AEGISAI_MODEL_MAX_OUTPUT_TOKENS: ${AEGISAI_MODEL_MAX_OUTPUT_TOKENS:-512}
      AEGISAI_MODEL_TIMEOUT_SECONDS: ${AEGISAI_MODEL_TIMEOUT_SECONDS:-60}
      AEGISAI_MODEL_MAX_CONCURRENCY: ${AEGISAI_MODEL_MAX_CONCURRENCY:-2}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "rq worker --url \"$$AEGISAI_REDIS_URL\" aegisai-campaigns"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  promptfoo-runner:
    build:
      context: ./tools/promptfoo-runner
      args:
        PROMPTFOO_VERSION: ${AEGISAI_PROMPTFOO_VERSION:-0.124.1}
    environment:
      AEGISAI_TOOL_RUNNER_API_URL: http://api:8000
      AEGISAI_TOOL_RUNNER_TOKEN: ${AEGISAI_TOOL_RUNNER_TOKEN:-}
      AEGISAI_TOOL_RUNNER_TIMEOUT_MS: ${AEGISAI_TOOL_RUNNER_TIMEOUT_MS:-180000}
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles:
      - tools
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /work:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_AUTH_REQUIRED: ${VITE_AUTH_REQUIRED:-false}
        VITE_ASYNC_CAMPAIGNS: ${VITE_ASYNC_CAMPAIGNS:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:5173:8080
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web-check:
    build:
      context: ./frontend
      target: build
    command: npm run lint
    profiles:
      - tools

volumes:
  aegisai-postgres:
  aegisai-redis:
