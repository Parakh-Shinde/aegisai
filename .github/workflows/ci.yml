name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt pip-audit

      - name: Run Ruff
        run: ruff check backend

      - name: Run MyPy
        run: mypy backend/app

      - name: Run backend tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          OLLAMA_BASE_URL: "http://127.0.0.1:11434"
        run: pytest

      - name: Validate production runtime configuration
        working-directory: backend
        env:
          AEGISAI_ENVIRONMENT: production
          AEGISAI_AUTH_REQUIRED: "true"
          AEGISAI_EXPOSE_API_DOCS: "false"
          AEGISAI_ALLOW_LOCAL_STAGING_BOOTSTRAP: "false"
          AEGISAI_ALLOW_REMOTE_OLLAMA: "false"
          AEGISAI_ALLOW_REMOTE_APPLICATION_TARGETS: "false"
          AEGISAI_AGENT_ENFORCEMENT_MODE: enforce
          AEGISAI_ASYNC_CAMPAIGNS: "true"
          AEGISAI_CORS_ORIGINS: "https://aegisai.example.invalid"
          AEGISAI_TRUSTED_HOSTS: "aegisai.example.invalid,api,localhost,127.0.0.1"
          AEGISAI_JWT_SECRET: "ci-only-not-a-production-secret-0123456789abcdef"
          AEGISAI_EVIDENCE_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          AEGISAI_MFA_ENCRYPTION_KEY: "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB="
          AEGISAI_AGENT_GATEWAY_TOKEN: "ci-only-gateway-token-not-for-deployment-012345"
          AEGISAI_TOOL_RUNNER_TOKEN: "ci-only-tool-runner-token-not-for-deployment-012345"
          AEGISAI_REDIS_URL: "redis://127.0.0.1:6379/0"
          DATABASE_URL: "postgresql+psycopg://ci:ci@127.0.0.1:5432/ci"
        run: python scripts/verify_runtime_config.py

      - name: Scan Python dependencies
        run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The GitHub Action now requires a commercial license. Keep the scan
      # free and reproducible by running a pinned upstream OSS release and
      # verifying the published archive checksum before execution.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.29.1"
          GITLEAKS_SHA256: "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar --extract --gzip --file "${RUNNER_TEMP}/gitleaks.tar.gz" --directory "${RUNNER_TEMP}/gitleaks"

      - name: Secret scan
        run: "${RUNNER_TEMP}/gitleaks/gitleaks detect --source . --redact --exit-code 2 --log-opts=-1"

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload vulnerability results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform blueprint
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

  release-gate:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Enforce evaluation release policy
        working-directory: backend
        run: python scripts/release_gate.py --source-revision "$GITHUB_SHA"

      - name: Upload release-integrity report
        uses: actions/upload-artifact@v4
        with:
          name: aegisai-release-integrity
          path: backend/build/release-integrity.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest release-integrity report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: backend/build/release-integrity.json

  production-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production Compose overlay without starting services
        run: |
          docker compose --env-file .env.production.example \
            -f compose.yaml -f compose.production.yaml config --quiet

      - name: Ensure real production env file is ignored
        run: git check-ignore --quiet .env.production
