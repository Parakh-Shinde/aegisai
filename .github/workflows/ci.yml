name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt pip-audit

      - name: Run Ruff
        run: ruff check backend

      - name: Run MyPy
        run: mypy backend/app

      - name: Run backend tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          OLLAMA_BASE_URL: "http://127.0.0.1:11434"
        run: pytest

      - name: Scan Python dependencies
        run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The GitHub Action now requires a commercial license. Keep the scan
      # free and reproducible by running a pinned upstream OSS release and
      # verifying the published archive checksum before execution.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.29.1"
          GITLEAKS_SHA256: "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar --extract --gzip --file "${RUNNER_TEMP}/gitleaks.tar.gz" --directory "${RUNNER_TEMP}/gitleaks"

      - name: Secret scan
        run: "${RUNNER_TEMP}/gitleaks/gitleaks detect --source . --redact --exit-code 2 --log-opts=-1"

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - name: Upload vulnerability results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Archive raw vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisai-trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce high and critical dependency vulnerabilities
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table .

      - name: Enforce high and critical configuration findings
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --format table .

      - name: Build production container images
        run: |
          docker build --pull -t aegisai-api:ci ./backend
          docker build --pull -t aegisai-web:ci ./frontend \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg VITE_AUTH_REQUIRED=true \
            --build-arg VITE_ASYNC_CAMPAIGNS=true
          docker build --pull -t aegisai-ocr-runner:ci ./tools/ocr-runner
          docker build --pull -t aegisai-promptfoo-runner:ci ./tools/promptfoo-runner
          docker build --pull -t aegisai-postgres:ci -f infra/postgres/Dockerfile .
          docker pull redis:7.4.11-bookworm
          docker build --pull -t aegisai-caddy:ci -f infra/caddy/Dockerfile .

      - name: Scan production container images for high and critical vulnerabilities
        shell: bash
        run: |
          status=0
          for image in \
            aegisai-api:ci \
            aegisai-web:ci \
            aegisai-ocr-runner:ci \
            aegisai-promptfoo-runner:ci \
            aegisai-postgres:ci \
            redis:7.4.11-bookworm \
            aegisai-caddy:ci; do
            slug="${image//:/-}"
            slug="${slug//\//-}"
            echo "Scanning $image"
            trivy image --severity HIGH,CRITICAL --format sarif --output "trivy-image-${slug}.sarif" "$image" || true
            trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --format table "$image" || status=1
          done
          exit "$status"

      - name: Archive container vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisai-container-vulnerability-reports
          path: trivy-image-*.sarif
          if-no-files-found: warn
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform blueprint
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

  release-gate:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Enforce evaluation release policy
        working-directory: backend
        run: python scripts/release_gate.py --source-revision "$GITHUB_SHA"

      - name: Upload release-integrity report
        uses: actions/upload-artifact@v4
        with:
          name: aegisai-release-integrity
          path: backend/build/release-integrity.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest release-integrity report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: backend/build/release-integrity.json

  production-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production Compose overlay without starting services
        run: |
          docker compose --env-file .env.production.example \
            -f compose.yaml -f compose.production.yaml config --quiet

      - name: Ensure real production env file is ignored
        run: git check-ignore --quiet .env.production
